name: Validate Hermes MTP Lab source release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Python API test dependencies
        # Hermes bundles FastAPI at runtime, but GitHub runners start clean.
        run: python -m pip install -r requirements-ci.txt
      - name: Check sources, version and public package
        run: python tools/verify_repo.py
      - name: Python logic and mock benchmarks
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Desktop plugin registration test
        run: node tests/test_desktop_registration.cjs
      - name: Build portable release and inspect contents
        run: |
          python tools/package_release.py --output dist
          python tools/check_dist.py --directory dist
  windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Static Windows package check
        shell: pwsh
        run: |
          python tools/verify_repo.py
          python tools/package_release.py --output dist
          python tools/check_dist.py --directory dist
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Install-Hermes-MTP-Lab.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          Write-Host 'PowerShell installer syntax PASS (no live Hermes deployment performed)'
